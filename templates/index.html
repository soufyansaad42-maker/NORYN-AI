<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>NORYN AI v4</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .suggestions-wrap { margin: 18px auto 10px; max-width: 850px; }
        .suggestions-title { text-align:center; font-size:14px; font-weight:700; color:#6b7280; margin-bottom:10px; }
        .suggestions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
        .suggestion { border:1px solid #e5e7eb; background:#fff; color:#111827; border-radius:14px; padding:12px 10px; min-height:48px; font:inherit; font-size:13px; cursor:pointer; transition:transform .15s ease,border-color .15s ease,background .15s ease; }
        .suggestion:active { transform:scale(.98); }
        .suggestion:hover { border-color:#9ca3af; background:#f9fafb; }
        @media (max-width:430px) {
            .suggestion { font-size:12px; padding:10px 7px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="logo">NORYN <span>AI</span></div>
    <div class="version">v4.0</div>
</header>

<main>
    <section class="welcome">
        <h1>مرحبًا بك في NORYN AI</h1>
        <p>مساعدك الذكي للبرمجة والتعلم والكتابة</p>

        <div class="suggestions-wrap">
            <div class="suggestions-title">✨ جرّب NORYN</div>
            <div class="suggestions">
                <button type="button" class="suggestion" data-prompt="اكتب لي قصة قصيرة وممتعة">✍️ اكتب لي قصة</button>
                <button type="button" class="suggestion" data-prompt="اشرح لي موضوعًا بطريقة بسيطة">📚 اشرح لي موضوعًا</button>
                <button type="button" class="suggestion" data-prompt="أعطني فكرة لمشروع جديد ومميز">💡 أعطني فكرة</button>
                <button type="button" class="suggestion" data-prompt="لخص لي هذا النص بطريقة واضحة">📝 لخص لي نصًا</button>
            </div>
        </div>
    </section>

    <div class="modes">
        <button data-mode="general" class="active">🌍 عام</button>
        <button data-mode="code">💻 برمجة</button>
        <button data-mode="learn">📚 تعلم</button>
        <button data-mode="write">✍️ كتابة</button>
    </div>

    <section id="chat">
        <div id="messages">
            <div class="message ai">مرحبًا! أنا NORYN AI 🤖<br>كيف يمكنني مساعدتك؟</div>
        </div>

        <div class="input-area">
            <textarea id="message" placeholder="اكتب رسالتك..."></textarea>
            <button id="send">إرسال</button>
        </div>
    </section>
</main>

<script src="/static/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const input = document.getElementById("message");
    document.querySelectorAll(".suggestion").forEach(function (button) {
        button.addEventListener("click", function () {
            if (!input) return;
            input.value = button.dataset.prompt || button.textContent.trim();
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        });
    });
});
</script>
</body>
</html>
