<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NORYN AI v4</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">NORYN <span>AI</span></div>
        <div class="version">v4.0</div>
    </header>

    <main>
        <section class="welcome">
            <h1>مرحبًا بك في NORYN AI</h1>
            <p>مساعدك الذكي للبرمجة والتعلم والكتابة</p>
        </section>

        <div class="modes">
            <button data-mode="general" class="active">🌍 عام</button>
            <button data-mode="code">💻 برمجة</button>
            <button data-mode="learn">📚 تعلم</button>
            <button data-mode="write">✍️ كتابة</button>
        </div>

        <section id="chat">
            <div id="messages">
                <div class="message ai">
                    مرحبًا! أنا NORYN AI 🤖<br>كيف يمكنني مساعدتك؟
                </div>
            </div>

            <div class="input-area">
                <textarea id="message" placeholder="اكتب رسالتك..."></textarea>
                <button id="send">إرسال</button>
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
